[package]
name = "picorg"
version = "0.1.0"
description = "PicOrg — organize your photos by metadata"
authors = ["PicOrg"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "picorg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks", "serde_json"] }

jwalk = "0.8"
rayon = "1.10"

image = { version = "0.25", features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
fast_image_resize = { version = "5", features = ["image"] }

kamadak-exif = "0.6"

xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
num_cpus = "1"

quick-xml = { version = "0.36", features = [] }

trash = "5"

[features]
default = []

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
incremental = false
