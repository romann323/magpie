[package]
name = "desktop"
version = "0.1.0"
description = "Magpie — tag-based library organizer for images, video and documents"
authors = ["Magpie"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

rusqlite = { version = "0.32", features = ["bundled", "backup", "hooks", "serde_json"] }

jwalk = "0.8"
rayon = "1.10"

image = { version = "0.25", features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
fast_image_resize = { version = "5", features = ["image"] }

kamadak-exif = "0.6"

xxhash-rust = { version = "0.8", features = ["xxh3"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
num_cpus = "1"

quick-xml = { version = "0.36", features = [] }

trash = "5"

# --- Automatic-AI-tagging pipeline (CLIP zero-shot tagger).
# `candle-*` are HuggingFace's pure-Rust ML stack — no C++ deps, no
# third-party CDN like ONNX Runtime's pyke.io (which was unreliable
# at the time we integrated this). candle-transformers ships a
# ready-made CLIP-ViT-B/32 model that we drive with a curated
# vocabulary — see `core/auto_tag/clip_classifier.rs`.
# `tokenizers` loads the BPE tokenizer JSON that HuggingFace
# distributes alongside every CLIP checkpoint.
# `hf-hub` streams the CLIP `model.safetensors` and `tokenizer.json`
# from `openai/clip-vit-base-patch32` on first use, with pinned SHA
# verification and resumable downloads under
# `<app_data_dir>/models/clip/`.
# `reqwest` also handles model download (bytes-streamed with
# progress events). `sha2` + `hex` verify checksums. `bytemuck`
# casts `[f32]` slices to `[u8]` for the on-disk embedding cache.
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
sha2 = "0.10"
hex = "0.4"
bytemuck = { version = "1", features = ["derive"] }
futures-util = "0.3"

# --- Windows-only: Shell IPropertyStore *read* fallback used by the
# scanner to import tags/titles that Windows Explorer's Properties →
# Details tab wrote to formats we can't natively parse (RAW families,
# MP4/MOV, HEIC, PDF, ...). After the DB redesign Magpie never writes
# back into the property store — everything persists in the per-folder
# library DB instead.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = []

[profile.release]
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
incremental = false
